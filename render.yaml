services:
  # Backend API Web Service
  - type: web
    name: financeflow-backend
    env: node
    plan: free
    buildCommand: cd server && npm install && npm run prisma:generate && npm run prisma:deploy
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: financeflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://financeflow.vercel.app

databases:
  # Managed PostgreSQL Database on Render
  - name: financeflow-db
    plan: free
    databaseName: expense_db
    user: postgres
